<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Redes Sociales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header class="profile-header">
      <h1 id="title">Mis Redes Sociales</h1>
      <p>¡Conéctate conmigo en mis plataformas oficiales!</p>
    </header>

    <section class="social-grid">
      <!-- Facebook -->
      <a href="https://facebook.com/TU_USUARIO" target="_blank" class="social-card facebook">
        <img src="assets/facebook.png" alt="Facebook" class="social-icon">
        <span class="social-name">Facebook</span>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/TU_INVITACION" target="_blank" class="social-card discord">
        <img src="assets/discord.png" alt="Discord" class="social-icon">
        <span class="social-name">Discord</span>
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/@TU_CANAL" target="_blank" class="social-card youtube">
        <img src="assets/youtube.png" alt="YouTube" class="social-icon">
        <span class="social-name">YouTube</span>
      </a>

      <!-- X (Twitter) -->
      <a href="https://x.com/TU_USUARIO" target="_blank" class="social-card x-twitter">
        <img src="assets/x.png" alt="X" class="social-icon">
        <span class="social-name">X</span>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@TU_USUARIO" target="_blank" class="social-card tiktok">
        <img src="assets/tiktok.png" alt="TikTok" class="social-icon">
        <span class="social-name">TikTok</span>
      </a>

      <!-- Twitch -->
      <a href="https://twitch.tv/TU_CANAL" target="_blank" class="social-card twitch">
        <img src="assets/twitch.png" alt="Twitch" class="social-icon">
        <span class="social-name">Twitch</span>
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
