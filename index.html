<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociales | Pacure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header class="profile-header">
      <h1 id="title">Pacure</h1>
      <p>¡Conéctate conmigo en mis redes oficiales!</p>
    </header>

    <section class="social-grid">
      <!-- YouTube -->
      <a href="https://www.youtube.com/@pacureok?from=website" target="_blank" class="social-card youtube" data-platform="YouTube">
        <img src="assets/youtube.png" alt="YouTube" class="social-icon">
        <span class="social-name">YouTube</span>
      </a>

      <!-- X (Twitter) -->
      <a href="https://x.com/PacureO17753?from=website" target="_blank" class="social-card x-twitter" data-platform="X">
        <img src="assets/x.png" alt="X" class="social-icon">
        <span class="social-name">X</span>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@pacure.ok?from=website" target="_blank" class="social-card tiktok" data-platform="TikTok">
        <img src="assets/tiktok.png" alt="TikTok" class="social-icon">
        <span class="social-name">TikTok</span>
      </a>

      <!-- Twitch -->
      <a href="https://www.twitch.tv/pacure_ok_ofi?from=website" target="_blank" class="social-card twitch" data-platform="Twitch">
        <img src="assets/twitch.png" alt="Twitch" class="social-icon">
        <span class="social-name">Twitch</span>
      </a>

      <!-- Facebook -->
      <a href="https://www.facebook.com/profile.php?id=100095468445938&mibextid=ZbWKwL&from=website" target="_blank" class="social-card facebook" data-platform="Facebook">
        <img src="assets/facebook.png" alt="Facebook" class="social-icon">
        <span class="social-name">Facebook</span>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/rVrzjNyF6Y" target="_blank" class="social-card discord" data-platform="Discord">
        <img src="assets/discord.png" alt="Discord" class="social-icon">
        <span class="social-name">Discord</span>
      </a>
    </section>

    <!-- Mensaje dinámico si el usuario llega con una subpágina/origen -->
    <div id="referrer-banner" class="banner hidden"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
