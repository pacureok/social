<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociales | Pacure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header class="profile-header">
      <h1 id="title">Pacure</h1>
      <p>¡Conéctate conmigo en mis redes oficiales!</p>
    </header>

    <!-- Banner que aparecerá automáticamente si vienen de otra red -->
    <div id="referrer-banner" class="banner"></div>

    <section class="social-grid">
      <!-- YouTube -->
      <a href="https://www.youtube.com/@pacureok" target="_blank" class="social-card youtube">
        <img src="assets/youtube.png" alt="YouTube" class="social-icon">
        <span class="social-name">YouTube</span>
      </a>

      <!-- X (Twitter) -->
      <a href="https://x.com/PacureO17753" target="_blank" class="social-card x-twitter">
        <img src="assets/x.png" alt="X" class="social-icon">
        <span class="social-name">X</span>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@pacure.ok" target="_blank" class="social-card tiktok">
        <img src="assets/tiktok.png" alt="TikTok" class="social-icon">
        <span class="social-name">TikTok</span>
      </a>

      <!-- Twitch -->
      <a href="https://www.twitch.tv/pacure_ok_ofi" target="_blank" class="social-card twitch">
        <img src="assets/twitch.png" alt="Twitch" class="social-icon">
        <span class="social-name">Twitch</span>
      </a>

      <!-- Facebook -->
      <a href="https://www.facebook.com/profile.php?id=100095468445938&mibextid=ZbWKwL" target="_blank" class="social-card facebook">
        <img src="assets/facebook.png" alt="Facebook" class="social-icon">
        <span class="social-name">Facebook</span>
      </a>

      <!-- Discord -->
      <a href="https://discord.gg/rVrzjNyF6Y" target="_blank" class="social-card discord">
        <img src="assets/discord.png" alt="Discord" class="social-icon">
        <span class="social-name">Discord</span>
      </a>
    </section>
  </main>

  <!-- Script enlazado al final -->
  <script src="script.js"></script>
</body>
</html>
